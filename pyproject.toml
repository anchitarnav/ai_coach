[project]
name = "ai-coach"
version = "0.1.0"
description = "AI Career Coach — a personal desktop app that acts as an AI-powered career coaching agent"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flet>=0.81.0,<1.0",
    "pydantic-ai[anthropic,openai,google]>=1.63.0,<2.0",
    "aiosqlite>=0.22.0,<1.0",
]

[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[tool.flet]
app.entry = "main.py"
